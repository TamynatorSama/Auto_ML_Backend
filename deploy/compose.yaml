# The platform's services on the Linux server. Tailscale Funnel terminates HTTPS
# and forwards to Caddy on 127.0.0.1:8080.
#   docker compose -f deploy/compose.yaml up -d --build
# The password is in /etc/automl/postgres.env (POSTGRES_PASSWORD=...), root:docker, mode 640.
name: automl   # not "deploy": that is the sandbox server's project name
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: /etc/automl/postgres.env
    environment:
      POSTGRES_USER: automl
      POSTGRES_DB: automl
    ports:
      - "127.0.0.1:5432:5432"   # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automl -d automl"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: automl-app:0.1.0
    restart: unless-stopped
    network_mode: host
    env_file: /etc/automl/app.env
    environment:
      AUTOML_UPLOADS_ROOT: /app/state/uploads
      AUTOML_RUNS_ROOT: /app/state/runs
    volumes:
      - appdata:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "api.app:app", "--host", "127.0.0.1", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    image: automl-app:0.1.0
    restart: unless-stopped
    network_mode: host
    env_file: /etc/automl/app.env
    environment:
      AUTOML_UPLOADS_ROOT: /app/state/uploads
      AUTOML_RUNS_ROOT: /app/state/runs
      AUTOML_WORKER_TASKS: 6
      AUTOML_WORKER_PLANS: 2
    volumes:
      - appdata:/app/state
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "worker"]

  web:
    build:
      context: ..
      dockerfile: deploy/Web.Dockerfile
    image: automl-web:0.1.0
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
